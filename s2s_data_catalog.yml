plugins:
  source:
    - module: intake_xarray

sources:
  OBS_SUBX:
    description: >-
      Observations to verify forecasts with. Most variables are from
      NOAA CPC, but geopotential height gh_500 and psl is from ERA.
    metadata:
      sources:
        - http://iridl.ldeo.columbia.edu/SOURCES/.NOAA/.NCEP/.CPC/.temperature/.daily/
        - http://iridl.ldeo.columbia.edu/SOURCES/.NOAA/.NCEP/.CPC/.UNIFIED_PRCP/.GAUGE_BASED/.GLOBAL/.v1p0/.extREALTIME/.rain/
        - add-ERA-link
      comment: gh_500 and psl from ERA
    parameters:
      data:
        description: data type
        type: str
        default: raw
        allowed: [raw, anom] # anom for anomaly
      lead:
        description: aggregation of leads in forecasts and time in observations
        type: str
        default: daily
        allowed: [daily, biweekly]
      dim:
        description: >-
          dimensionality of the data
            geospatial contains lon and lat
            country contains no lon and lat but aggregated data by country
        type: str
        default: geospatial
        allowed: [geospatial, country]
    driver: zarr
    args:
      urlpath: /glade/campaign/mmm/c3we/jaye/S2S_zarr/OBS_SUBX.{{data}}.{{lead}}.{{dim}}.zarr
      chunks: auto
      use_cftime: True

  OBS_ERA5:
    description: >-
      Observations to verify forecasts withs from ERA5 regridded to SubX grid 360x181
    metadata:
      sources:
        - add-ERA-link
    parameters:
